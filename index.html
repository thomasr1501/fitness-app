<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness & Ernährungs-Tracker</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #03dac6;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --border-radius: 8px;
            --input-bg: #2c2c2c;
            --border-color: #444;
            --danger-color: #cf6679;
            --success-color: #4caf50;
            --warning-color: #ff9800;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 1rem;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
        }

        .version-badge {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }

        .global-date-container {
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            background: var(--surface-color);
            padding: 0.75rem;
            border-radius: var(--border-radius);
        }

        .global-date-container label {
            margin: 0;
            font-size: 1rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .global-date-container input {
            flex: 1;
            margin: 0;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            flex: 1;
            padding: 0.75rem 0.25rem;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: #000;
            border-color: var(--primary-color);
        }

        .view {
            display: none;
            flex-direction: column;
            gap: 1.5rem;
        }

        .view.active {
            display: flex;
        }

        .card {
            background-color: var(--surface-color);
            padding: 1.25rem;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        h2, h3 {
            margin-top: 0;
            margin-bottom: 1rem;
            font-size: 1.25rem;
            color: var(--primary-color);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 1rem;
        }

        .row {
            display: flex;
            gap: 0.75rem;
        }

        .row .form-group {
            flex: 1;
        }

        label {
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        input, select {
            padding: 0.75rem;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: var(--border-radius);
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
            color-scheme: dark;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .btn {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--primary-color);
            color: #000;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .btn-secondary {
            background-color: var(--input-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            text-align: center;
            font-size: 0.95rem;
            font-weight: bold;
        }

        .btn-secondary:active {
            background-color: #3d3d3d;
        }
        
        .btn-text-left {
            text-align: left;
            font-weight: normal;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .history-item {
            background-color: var(--input-bg);
            padding: 0.85rem;
            border-radius: var(--border-radius);
            border-left: 4px solid var(--primary-color);
            position: relative;
        }

        .history-item-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: var(--text-primary);
            font-size: 1rem;
            padding-right: 60px;
        }

        .history-item-details {
            color: var(--text-secondary);
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .action-btns {
            position: absolute;
            top: 0.85rem;
            right: 0.85rem;
            display: flex;
            gap: 0.5rem;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0;
            opacity: 0.8;
        }

        .icon-btn:hover {
            opacity: 1;
        }

        details {
            background-color: var(--surface-color);
            border-radius: var(--border-radius);
            margin-bottom: 0.75rem;
            border: 1px solid var(--border-color);
        }

        summary {
            padding: 1rem;
            font-weight: bold;
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        summary::after {
            content: "▼";
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        details[open] summary::after {
            content: "▲";
        }

        details[open] {
            padding-bottom: 1rem;
        }

        .details-content {
            padding: 0 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        #temp-sets-container ul {
            list-style-type: none;
            padding: 0;
        }
        #temp-sets-container li {
            background: var(--surface-color);
            padding: 0.5rem;
            margin-bottom: 0.25rem;
            border-radius: 4px;
            border-left: 2px solid var(--text-secondary);
        }

        #search-results-box {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            max-height: 150px;
            overflow-y: auto;
            display: none;
            margin-top: 0.25rem;
        }
        .search-result-item {
            padding: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border-color);
        }
        .search-result-item:hover {
            background-color: #3d3d3d;
        }

        .summary-box {
            background: var(--input-bg);
            padding: 1rem;
            border-radius: var(--border-radius);
            margin-bottom: 1rem;
            border-left: 4px solid
