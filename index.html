<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness & Ernährungs-Tracker</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #03dac6;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --border-radius: 8px;
            --input-bg: #2c2c2c;
            --border-color: #444;
            --danger-color: #cf6679;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 1rem;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
        }

        .version-badge {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }

        .global-date-container {
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            background: var(--surface-color);
            padding: 0.75rem;
            border-radius: var(--border-radius);
        }

        .global-date-container label {
            margin: 0;
            font-size: 1rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .global-date-container input {
            flex: 1;
            margin: 0;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            flex: 1;
            padding: 0.75rem 0.25rem;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: #000;
            border-color: var(--primary-color);
        }

        .view {
            display: none;
            flex-direction: column;
            gap: 1.5rem;
        }

        .view.active {
            display: flex;
        }

        .card {
            background-color: var(--surface-color);
            padding: 1.25rem;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        h2, h3 {
            margin-top: 0;
            margin-bottom: 1rem;
            font-size: 1.25rem;
            color: var(--primary-color);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 1rem;
        }

        .row {
            display: flex;
            gap: 0.75rem;
        }

        .row .form-group {
            flex: 1;
        }

        label {
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        input, select {
            padding: 0.75rem;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: var(--border-radius);
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
            color-scheme: dark;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .btn {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--primary-color);
            color: #000;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .btn-secondary {
            background-color: var(--input-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            text-align: center;
            font-size: 0.95rem;
            font-weight: bold;
        }

        .btn-secondary:active {
            background-color: #3d3d3d;
        }
        
        .btn-text-left {
            text-align: left;
            font-weight: normal;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .history-item {
            background-color: var(--input-bg);
            padding: 0.85rem;
            border-radius: var(--border-radius);
            border-left: 4px solid var(--primary-color);
            position: relative;
        }

        .history-item-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
            color: var(--text-primary);
            font-size: 1rem;
            padding-right: 60px;
        }

        .history-item-details {
            color: var(--text-secondary);
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .action-btns {
            position: absolute;
            top: 0.85rem;
            right: 0.85rem;
            display: flex;
            gap: 0.5rem;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0;
            opacity: 0.8;
        }

        .icon-btn:hover {
            opacity: 1;
        }

        details {
            background-color: var(--surface-color);
            border-radius: var(--border-radius);
            margin-bottom: 0.75rem;
            border: 1px solid var(--border-color);
        }

        summary {
            padding: 1rem;
            font-weight: bold;
            cursor: pointer;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        summary::after {
            content: "▼";
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        details[open] summary::after {
            content: "▲";
        }

        details[open] {
            padding-bottom: 1rem;
        }

        .details-content {
            padding: 0 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        #temp-sets-container ul {
            list-style-type: none;
            padding: 0;
        }
        #temp-sets-container li {
            background: var(--surface-color);
            padding: 0.5rem;
            margin-bottom: 0.25rem;
            border-radius: 4px;
            border-left: 2px solid var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="version-badge">Version 4.1 - Cardio Update</div>

        <!-- Globales Datum -->
        <div class="global-date-container">
            <label for="global-date">📅 Datum:</label>
            <input type="date" id="global-date">
        </div>

        <!-- Navigation -->
        <div class="tabs">
            <button class="tab-btn active" id="btn-tab-training">Training</button>
            <button class="tab-btn" id="btn-tab-nutrition">Ernährung</button>
            <button class="tab-btn" id="btn-tab-archive">Archiv</button>
        </div>

        <!-- Training View -->
        <div class="view active" id="view-training">
            <!-- AKTUALISIERTES CARDIO MODUL -->
            <div class="card">
                <h2>Cardio</h2>
                <div class="form-group">
                    <label for="cardio-type">Sportart</label>
                    <select id="cardio-type">
                        <option value="Laufen">Laufen</option>
                        <option value="Laufband">Laufband</option>
                        <option value="Stairmaster">Stairmaster</option>
                        <option value="Fahrrad">Fahrrad</option>
                    </select>
                </div>
                <div class="row">
                    <div class="form-group">
                        <label for="cardio-distance">Distanz (km)</label>
                        <input type="number" id="cardio-distance" placeholder="z.B. 4" step="0.1">
                    </div>
                    <div class="form-group">
                        <label for="cardio-pace">Pace (min/km)</label>
                        <input type="text" id="cardio-pace" placeholder="z.B. 6:00">
                    </div>
                </div>
                <div class="row">
                    <div class="form-group">
                        <label for="cardio-duration">Dauer</label>
                        <input type="text" id="cardio-duration" placeholder="z.B. 20 min">
                    </div>
                    <div class="form-group">
                        <label for="cardio-incline">Neigung</label>
                        <input type="text" id="cardio-incline" placeholder="z.B. 5%">
                    </div>
                    <div class="form-group">
                        <label for="cardio-level">Stufe</label>
                        <input type="text" id="cardio-level" placeholder="z.B. Level 8">
                    </div>
                </div>
                <button class="btn" id="btn-save-cardio">Cardio speichern</button>
            </div>

            <!-- WORKOUT MODUL -->
            <div class="card">
                <h2>Workout</h2>
                <div class="form-group">
                    <label for="strength-gym">Fitnessstudio (Optional)</label>
                    <input type="text" id="strength-gym" placeholder="z.B. CleverFit">
                </div>
                <div class="form-group">
                    <label for="strength-exercise">Übung</label>
                    <select id="strength-exercise">
                        <option value="Rudern am Kabelzug">Rudern am Kabelzug</option>
                        <option value="Chin-Assists">Chin-Assists</option>
                        <option value="Hyperextensions">Hyperextensions</option>
                        <option value="Seitheben">Seitheben</option>
                        <option value="Bizeps-Curls">Bizeps-Curls</option>
                        <option value="Trizeps-Curls">Trizeps-Curls</option>
                        <option value="Kabel-Brustfliegende (oben)">Kabel-Brustfliegende (oben)</option>
                        <option value="Kabel-Brustfliegende (unten)">Kabel-Brustfliegende (unten)</option>
                        <option value="Sit-ups">Sit-ups</option>
                        <option value="custom">Benutzerdefiniert...</option>
                    </select>
                    <input type="text" id="strength-exercise-custom" placeholder="Eigene Übung eingeben" style="display:none; margin-top:0.5rem;">
                </div>
                <div class="row">
                    <div class="form-group">
                        <label for="strength-reps">Wdh.</label>
                        <input type="number" id="strength-reps" placeholder="12">
                    </div>
                    <div class="form-group">
                        <label for="strength-weight">Gewicht (kg)</label>
                        <input type="number" id="strength-weight" placeholder="50">
                    </div>
                </div>
                <button class="btn btn-secondary" id="btn-add-set">+ Satz hinzufügen</button>
                <div id="temp-sets-container" style="margin-top: 1rem; margin-bottom: 1rem; font-size: 0.9rem; color: var(--text-primary);">
                    <ul id="temp-sets-list"></ul>
                </div>
                <button class="btn" id="btn-save-strength">Übung & Sätze in Cloud speichern</button>
            </div>

            <div class="card">
                <h2>Training am gewählten Tag</h2>
                <div id="workout-list" class="history-list"></div>
            </div>
        </div>

        <!-- Nutrition View -->
        <div class="view" id="view-nutrition">
            <div class="card">
                <h2>Lebensmittel tracken</h2>
                <div class="form-group">
                    <label for="food-search">Suchen (Platzhalter)</label>
                    <input type="text" id="food-search" placeholder="z.B. Haferflocken">
                </div>
                <div class="form-group">
                    <label for="food-amount">Menge (g)</label>
                    <input type="number" id="food-amount" placeholder="100">
                </div>
                <button class="btn" id="btn-search-food">Suchen & Eintragen</button>
            </div>

            <div class="card">
                <h2>Schnell-Log (One-Click)</h2>
                <div class="quick-logs">
                    <button class="btn btn-secondary btn-text-left" id="btn-quick-breakfast">
                        + Frühstück: 2 Eier, Pumpernickel
                    </button>
                    <button class="btn btn-secondary btn-text-left" id="btn-quick-lunch">
                        + Mittag: Milbona Quarkcreme, Müsli, Nüsse
                    </button>
                </div>
            </div>

            <div class="card">
                <h2>Ernährung am gewählten Tag</h2>
                <div id="nutrition-list" class="history-list"></div>
            </div>
        </div>

        <!-- Archiv View -->
        <div class="view" id="view-archive">
            <div class="card">
                <h2>Trainings-Historie (Alle)</h2>
                <div id="archive-list"></div>
            </div>
        </div>
    </div>

    <!-- FEHLER-DIAGNOSE SCRIPT -->
    <script>
        window.addEventListener("error", function(e) {
            alert("JS-Fehler in Zeile " + e.lineno + ": " + e.message);
        });
        window.addEventListener("unhandledrejection", function(e) {
            alert("Firebase-Fehler: " + (e.reason ? e.reason.message : "Unbekannter Cloud-Fehler"));
        });
    </script>

    <!-- Firebase SDK & Logik -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, deleteDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyADXyu1B6sXNR0LdG-K75V3JpU9VFTfNGc",
            authDomain: "fitnesstracker-b396d.firebaseapp.com",
            projectId: "fitnesstracker-b396d",
            storageBucket: "fitnesstracker-b396d.firebasestorage.app",
            messagingSenderId: "609703629861",
            appId: "1:609703629861:web:38ea62b6ef9e0b1f9e9bcc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Datum Logik
        const dateInput = document.getElementById('global-date');
        const getTodayString = () => new Date().toISOString().split('T')[0];
        dateInput.value = getTodayString();
        dateInput.addEventListener('change', () => loadDayData());

        // Navigation
        const tabs = [
            { btn: document.getElementById('btn-tab-training'), view: document.getElementById('view-training') },
            { btn: document.getElementById('btn-tab-nutrition'), view: document.getElementById('view-nutrition') },
            { btn: document.getElementById('btn-tab-archive'), view: document.getElementById('view-archive') }
        ];

        tabs.forEach(tab => {
            tab.btn.addEventListener('click', () => {
                tabs.forEach(t => { t.btn.classList.remove('active'); t.view.classList.remove('active'); });
                tab.btn.classList.add('active');
                tab.view.classList.add('active');
                if (tab.btn.id === 'btn-tab-archive') loadArchiveData();
            });
        });
        
        // --- Cardio Speichern (Erweitert) ---
        document.getElementById('btn-save-cardio').addEventListener('click', async () => {
            const type = document.getElementById('cardio-type').value;
            const distance = document.getElementById('cardio-distance').value;
            const pace = document.getElementById('cardio-pace').value;
            const duration = document.getElementById('cardio-duration').value;
            const incline = document.getElementById('cardio-incline').value;
            const level = document.getElementById('cardio-level').value;
            
            if(!distance && !duration) return alert("Bitte mindestens Distanz oder Dauer eingeben.");
            
            try {
                await addDoc(collection(db, "workouts"), {
                    date: dateInput.value,
                    category: "cardio",
                    type, distance, pace, duration, incline, level,
                    timestamp: new Date()
                });
                // Inputs leeren
                document.getElementById('cardio-distance').value = '';
                document.getElementById('cardio-pace').value = '';
                document.getElementById('cardio-duration').value = '';
                document.getElementById('cardio-incline').value = '';
                document.getElementById('cardio-level').value = '';
                loadDayData();
            } catch (e) { console.error("Fehler:", e); }
        });

        // --- Workout Logik ---
        let currentSets = [];
        
        const exerciseSelect = document.getElementById('strength-exercise');
        const exerciseCustom = document.getElementById('strength-exercise-custom');
        
        exerciseSelect.addEventListener('change', () => {
            if (exerciseSelect.value === 'custom') {
                exerciseCustom.style.display = 'block';
            } else {
                exerciseCustom.style.display = 'none';
            }
        });

        document.getElementById('btn-add-set').addEventListener('click', () => {
            const reps = document.getElementById('strength-reps').value;
            const weight = document.getElementById('strength-weight').value;
            
            if(!reps || !weight) return alert("Bitte Wdh. und Gewicht eingeben.");
            
            currentSets.push({ reps: Number(reps), weight: Number(weight) });
            renderTempSets();
            document.getElementById('strength-reps').value = '';
        });

        function renderTempSets() {
            const list = document.getElementById('temp-sets-list');
            if (currentSets.length === 0) {
                list.innerHTML = "";
            } else {
                list.innerHTML = currentSets.map((s, i) => `<li>Satz ${i+1}: <b>${s.reps}x</b> mit <b>${s.weight}kg</b></li>`).join('');
            }
        }

        document.getElementById('btn-save-strength').addEventListener('click', async () => {
            let exercise = exerciseSelect.value;
            if (exercise === 'custom') {
                exercise = exerciseCustom.value;
                if (!exercise) return alert("Bitte eine benutzerdefinierte Übung eingeben.");
            }
            
            const gym = document.getElementById('strength-gym').value || ""; 
            if (currentSets.length === 0) return alert("Bitte füge über den grauen Button '+ Satz hinzufügen' mindestens einen Satz hinzu.");
            
            try {
                await addDoc(collection(db, "workouts"), {
                    date: dateInput.value,
                    category: "strength",
                    exercise, 
                    gym,
                    sets: currentSets,
                    timestamp: new Date()
                });
                
                currentSets = [];
                renderTempSets();
                document.getElementById('strength-reps').value = ''; 
                if (exerciseSelect.value === 'custom') {
                    exerciseCustom.value = '';
                    exerciseCustom.style.display = 'none';
                    exerciseSelect.selectedIndex = 0;
                }
                
                loadDayData();
            } catch (e) { console.error("Fehler:", e); }
        });

        // --- Ernährung ---
        const saveNutrition = async (mealDetails) => {
            try {
                await addDoc(collection(db, "nutrition"), {
                    date: dateInput.value,
                    meal: mealDetails,
                    timestamp: new Date()
                });
                loadDayData();
            } catch (e) { console.error("Fehler:", e); }
        };

        document.getElementById('btn-quick-breakfast').addEventListener('click', () => saveNutrition("Frühstück: 2 Eier, Pumpernickel"));
        document.getElementById('btn-quick-lunch').addEventListener('click', () => saveNutrition("Mittagessen: Quarkcreme, Müsli, Nüsse"));

        // --- Render Logik Tagesansicht ---
        async function loadDayData() {
            const selectedDate = dateInput.value;
            const workoutList = document.getElementById('workout-list');
            const nutritionList = document.getElementById('nutrition-list');
            
            const qWorkouts = query(collection(db, "workouts"), where("date", "==", selectedDate));
            const workoutSnap = await getDocs(qWorkouts);
            let workoutsHtml = '';
            
            workoutSnap.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                
                if (data.category === "cardio") {
                    let details = [];
                    if (data.distance) details.append ? details.push(`${data.distance} km`) : details.push(`${data.distance} km`);
                    if (data.pace) details.push(`Pace: ${data.pace} min/km`);
                    if (data.duration) details.push(`Dauer: ${data.duration}`);
                    if (data.incline) details.push(`Neigung: ${data.incline}`);
                    if (data.level) details.push(`Stufe: ${data.level}`);

                    workoutsHtml += `<div class="history-item">
                        <div class="action-btns">
                            <button class="icon-btn btn-delete" data-id="${id}" data-col="workouts">🗑️</button>
                        </div>
                        <div class="history-item-title">🏃 ${data.type}</div>
                        <div class="history-item-details">${details.join(' | ')}</div>
                    </div>`;
                } else if (data.category === "strength") {
                    const gymText = data.gym ? `📍 ${data.gym}<br>` : "";
                    let setsDisplay = "";
                    let isArray = false;
                    let setsStrForEdit = "";
                    
                    if (Array.isArray(data.sets)) {
                        isArray = true;
                        setsDisplay = data.sets.map(s => `<b>${s.reps}x</b> ${s.weight}kg`).join(' | ');
                        setsStrForEdit = data.sets.map(s => `${s.reps}x${s.weight}`).join(', ');
                    } else {
                        setsDisplay = `${data.sets} Sätze × ${data.reps} Wdh. mit ${data.weight} kg`;
                    }

                    workoutsHtml += `<div class="history-item">
                        <div class="action-btns">
                            <button class="icon-btn btn-edit" data-id="${id}" data-col="workouts" data-cat="strength" data-isarray="${isArray}" data-setsstr="${setsStrForEdit}">✏️</button>
                            <button class="icon-btn btn-delete" data-id="${id}" data-col="workouts">🗑️</button>
                        </div>
                        <div class="history-item-title">💪 ${data.exercise}</div>
                        <div class="history-item-details">${gymText}${setsDisplay}</div>
                    </div>`;
                }
            });
            workoutList.innerHTML = workoutsHtml || '<div class="history-item-details">Kein Training für dieses Datum.</div>';

            const qNutrition = query(collection(db, "nutrition"), where("date", "==", selectedDate));
            const nutritionSnap = await getDocs(qNutrition);
            let nutritionHtml = '';
            
            nutritionSnap.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                nutritionHtml += `<div class="history-item">
                    <div class="action-btns">
                        <button class="icon-btn btn-edit" data-id="${id}" data-col="nutrition" data-meal="${data.meal}">✏️</button>
                        <button class="icon-btn btn-delete" data-id="${id}" data-col="nutrition">🗑️</button>
                    </div>
                    <div class="history-item-title">🍽️ Mahlzeit</div>
                    <div class="history-item-details">${data.meal}</div>
                </div>`;
            });
            nutritionList.innerHTML = nutritionHtml || '<div class="history-item-details">Keine Mahlzeiten für dieses Datum.</div>';
        }

        // --- Render Logik Archiv ---
        async function loadArchiveData() {
            const archiveList = document.getElementById('archive-list');
            archiveList.innerHTML = "Lade Daten...";

            const qWorkouts = query(collection(db, "workouts"));
            const snap = await getDocs(qWorkouts);
            
            const grouped = {};
            snap.forEach(docSnap => {
                const data = docSnap.data();
                if (!grouped[data.date]) grouped[data.date] = { items: [], gym: "" };
                grouped[data.date].items.push(data);
                if (data.gym) grouped[data.date].gym = data.gym; 
            });

            const sortedDates = Object.keys(grouped).sort((a, b) => b.localeCompare(a));
            
            let html = "";
            sortedDates.forEach(date => {
                const gymTitle = grouped[date].gym ? ` - ${grouped[date].gym}` : "";
                const dateObj = new Date(date);
                const dateString = dateObj.toLocaleDateString('de-DE');

                html += `<details>
                    <summary>📅 ${dateString}${gymTitle}</summary>
                    <div class="details-content">`;
                
                grouped[date].items.forEach(data => {
                    if (data.category === "cardio") {
                        let details = [];
                        if (data.distance) details.push(`${data.distance}km`);
                        if (data.pace) details.push(`${data.pace} min/km`);
                        if (data.duration) details.push(data.duration);
                        if (data.incline) details.push(`Neig: ${data.incline}`);
                        if (data.level) details.push(data.level);
                        html += `<div class="history-item-details">🏃 <b>${data.type}:</b> ${details.join(' | ')}</div>`;
                    } else if (data.category === "strength") {
                        let setsText = "";
                        if (Array.isArray(data.sets)) {
                            setsText = data.sets.map(s => `${s.reps}x${s.weight}kg`).join(' | ');
                        } else {
                            setsText = `${data.sets} Sätze x ${data.reps} Wdh @ ${data.weight}kg`;
                        }
                        html += `<div class="history-item-details">💪 <b>${data.exercise}:</b> ${setsText}</div>`;
                    }
                });

                html += `</div></details>`;
            });

            archiveList.innerHTML = html || "Keine Historie vorhanden.";
        }

        // --- Event-Delegation Edit / Delete ---
        document.addEventListener('click', async (e) => {
            if (e.target.classList.contains('btn-delete')) {
                const id = e.target.dataset.id;
                const col = e.target.dataset.col;
                
                if (confirm("Eintrag wirklich löschen?")) {
                    await deleteDoc(doc(db, col, id));
                    loadDayData(); 
                    if (document.getElementById('view-archive').classList.contains('active')) loadArchiveData();
                }
            }

            if (e.target.classList.contains('btn-edit')) {
                const id = e.target.dataset.id;
                const col = e.target.dataset.col;
                const docRef = doc(db, col, id);

                if (col === "nutrition") {
                    const oldMeal = e.target.dataset.meal;
                    const newMeal = prompt("Mahlzeit bearbeiten:", oldMeal);
                    if (newMeal !== null && newMeal !== "") {
                        await updateDoc(docRef, { meal: newMeal });
                        loadDayData();
                    }
                } else if (col === "workouts") {
                    const cat = e.target.dataset.cat;
                    if (cat === "strength") {
                        const currentSetsStr = e.target.dataset.setsstr;
                        const newSetsStr = prompt("Sätze bearbeiten.\nFormat: Wdh x Gewicht, getrennt mit Komma (z.B. 12x50, 9x55):", currentSetsStr);
                        
                        if (newSetsStr) {
                            try {
                                const newSetsArr = newSetsStr.split(',').map(s => {
                                    const parts = s.trim().split('x');
                                    return { reps: Number(parts[0]), weight: Number(parts[1] || 0) };
                                });
                                await updateDoc(docRef, { sets: newSetsArr });
                                loadDayData();
                                if (document.getElementById('view-archive').classList.contains('active')) loadArchiveData();
                            } catch(err) {
                                alert("Fehler beim Format. Bitte so eingeben: 12x50, 9x55");
                            }
                        }
                    }
                }
            }
        });

        // Init beim Start
        loadDayData();
    </script>
</body>
</html>
